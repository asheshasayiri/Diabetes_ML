<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DiabetesXAI — Risk Predictor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 36px 40px;
      width: 100%;
      max-width: 540px;
    }
    h1 { font-size: 1.6rem; color: #1a202c; margin-bottom: 4px; }
    .subtitle { color: #718096; font-size: 0.9rem; margin-bottom: 28px; }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 4px;
    }
    input[type="number"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 0.95rem;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: #4299e1;
      box-shadow: 0 0 0 3px rgba(66,153,225,0.15);
    }
    .hint { font-size: 0.75rem; color: #a0aec0; margin-top: -12px; margin-bottom: 14px; }
    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background: #4299e1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    button[type="submit"]:hover { background: #3182ce; }
    .footer { text-align: center; margin-top: 20px; font-size: 0.75rem; color: #a0aec0; }
  </style>
</head>
<body>
<div class="card">
  <h1>🧠 DiabetesXAI</h1>
  <p class="subtitle">Diabetes risk prediction with explainable AI (SHAP)</p>

  <form action="/predict" method="POST">
    <label for="Pregnancies">Pregnancies</label>
    <input type="number" id="Pregnancies" name="Pregnancies" min="0" max="20" step="1" placeholder="e.g. 2" required>

    <label for="Glucose">Glucose (mg/dL)</label>
    <input type="number" id="Glucose" name="Glucose" min="0" max="300" step="1" placeholder="e.g. 120" required>

    <label for="BloodPressure">Blood Pressure (mm Hg)</label>
    <input type="number" id="BloodPressure" name="BloodPressure" min="0" max="200" step="1" placeholder="e.g. 70" required>

    <label for="SkinThickness">Skin Thickness (mm)</label>
    <input type="number" id="SkinThickness" name="SkinThickness" min="0" max="100" step="1" placeholder="e.g. 20" required>

    <label for="Insulin">Insulin (μU/mL)</label>
    <input type="number" id="Insulin" name="Insulin" min="0" max="900" step="1" placeholder="e.g. 80" required>

    <label for="BMI">BMI (kg/m²)</label>
    <input type="number" id="BMI" name="BMI" min="0" max="70" step="0.1" placeholder="e.g. 28.5" required>

    <label for="DiabetesPedigreeFunction">Diabetes Pedigree Function</label>
    <input type="number" id="DiabetesPedigreeFunction" name="DiabetesPedigreeFunction" min="0" max="3" step="0.001" placeholder="e.g. 0.627" required>
    <p class="hint">Family history score (0.078 – 2.42)</p>

    <label for="Age">Age (years)</label>
    <input type="number" id="Age" name="Age" min="1" max="120" step="1" placeholder="e.g. 33" required>

    <button type="submit">Predict Risk →</button>
  </form>

  <p class="footer">Neural network built from scratch · NumPy only · SHAP explanations</p>
</div>
</body>
</html>
